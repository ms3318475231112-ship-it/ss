<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;color:var(--ink);line-height:1.5;background:linear-gradient(165deg,#e4f5ff,#cfe9ff 55%,#e1f3ff);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 12% 10%,rgba(70,170,250,.5),transparent 42%),radial-gradient(circle at 92% 38%,rgba(125,215,255,.6),transparent 40%),radial-gradient(circle at 20% 92%,rgba(150,175,255,.42),transparent 45%),radial-gradient(circle at 85% 95%,rgba(120,225,235,.45),transparent 40%)}
.wrap{max-width:560px;margin:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(104px + env(safe-area-inset-bottom,0px))}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.3));border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:0 12px 30px var(--sh),inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(255,255,255,.4)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 38%)}
.glass>*{position:relative;z-index:1}
header{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;padding:12px 16px;margin-bottom:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.2rem}.badge{font-size:.76rem;color:var(--mut)}
.btn{font:inherit;font-size:.95rem;min-height:48px;border:1px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--ink);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.55));box-shadow:0 4px 0 rgba(90,150,200,.3),0 8px 14px var(--sh);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,150,200,.3),0 2px 5px var(--sh)}
.btn.on{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;font-weight:700;border-color:#7fd0fc;box-shadow:0 4px 0 #1b7fc1,0 8px 14px var(--sh)}
.btn.in{background:linear-gradient(180deg,#52d3a7,#1aa077);color:#fff;border-color:#8fe6c8;box-shadow:0 4px 0 #0f7a5a,0 8px 14px var(--sh)}
.btn.out{background:linear-gradient(180deg,#ff94ab,#e24b69);color:#fff;border-color:#ffbccb;box-shadow:0 4px 0 #b2344e,0 8px 14px var(--sh)}
.btn.pdf{background:linear-gradient(180deg,#ffc07d,#f28c2e);color:#fff;border-color:#ffd9ae;box-shadow:0 4px 0 #bf6a16,0 8px 14px var(--sh)}
.btn.xl{background:linear-gradient(180deg,#52d3a7,#1b9a74);color:#fff;border-color:#8fe6c8;box-shadow:0 4px 0 #0f7a5a,0 8px 14px var(--sh)}
.btn.blue{background:linear-gradient(180deg,var(--ac2),var(--ac));color:#fff;border-color:#7fd0fc;box-shadow:0 4px 0 #1b7fc1,0 8px 14px var(--sh)}
.nav{position:fixed;z-index:20;left:max(10px,calc(50% - 270px));right:max(10px,calc(50% - 270px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;border-radius:26px}
.nav button{font:inherit;border:0;background:transparent;color:var(--mut);border-radius:20px;padding:7px 2px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.74rem;cursor:pointer}
.nav button b{font-size:1.35rem;line-height:1.2;font-weight:400}
.nav button.on{color:#fff;font-weight:700;background:linear-gradient(180deg,var(--ac2),var(--ac));box-shadow:0 5px 12px rgba(30,130,210,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card:first-child{grid-column:1/-1}
.card{padding:16px}
.card small{color:var(--mut);font-size:.9rem}.card .v{font-size:1.65rem;font-weight:800;margin:4px 0;word-break:break-all}
.row{display:flex;flex-direction:column;font-size:.84rem;color:var(--mut)}
.grid .card:first-child .row{flex-direction:row;justify-content:space-between}
.pos{color:var(--in)}.neg{color:var(--out)}
.note{padding:14px 16px;margin-bottom:12px;font-size:.92rem}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;margin-bottom:12px}
.tools .full{grid-column:1/-1}
input,select{font:inherit;font-size:16px;min-height:48px;width:100%;color:var(--ink);padding:9px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.6);box-shadow:inset 0 2px 5px rgba(40,120,190,.14)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:flex;flex-direction:column;gap:5px;font-size:.86rem;color:var(--mut)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px;margin-bottom:12px;text-align:center}
.strip small{display:block;color:var(--mut);font-size:.74rem}.strip b{font-size:1rem}
.tx{padding:12px 14px;margin-bottom:10px}
.tx .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{font-size:.78rem;padding:2px 12px;border-radius:99px;background:rgba(42,159,230,.16);color:#16689f;border:1px solid rgba(42,159,230,.3)}
.dt{font-size:.82rem;color:var(--mut)}
.tx .r2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.amt{font-size:1.35rem;font-weight:800}.bal{font-size:.84rem;color:var(--mut)}
.tx .nt{margin-top:4px;font-size:.92rem;padding-top:6px;border-top:1px dashed rgba(90,150,200,.35)}
.tx .act{display:flex;justify-content:flex-end;gap:6px;margin-top:2px}
.x{background:none;border:0;cursor:pointer;font-size:1.2rem;min-width:48px;min-height:44px}
.empty{padding:26px;text-align:center;color:var(--mut)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seg .btn{min-height:56px;flex-direction:column;gap:0;font-size:.9rem}
form{display:grid;grid-template-columns:1fr;gap:12px;padding:16px}
.ttl{padding:16px 18px 0;font-weight:700;font-size:1.1rem}
.hide{display:none}
</style>
</head>
